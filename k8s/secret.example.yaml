apiVersion: v1
kind: Secret
metadata:
  name: catalog-api-secret
type: Opaque
stringData:
  # Modelo legado vazio. Na Fase 4 use apply-cloud-secrets.ps1 na orquestracao.
  ConnectionStrings__CatalogDatabase: ""
  Jwt__Key: "<same-32-byte-or-longer-key-used-by-users-api>"
  RabbitMq__Username: "<rabbitmq-username>"
  RabbitMq__Password: "<rabbitmq-password>"
